<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ClientFlow AI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">C</span> ClientFlow <span class="ai">AI</span></a>{% if session.get('user_id') %}<nav><a href="{{ url_for('dashboard') }}">Overview</a><a href="{{ url_for('clients_page') }}">Clients</a><a href="{{ url_for('projects_page') }}">Projects</a><a href="{{ url_for('tasks_page') }}">Tasks</a><a href="{{ url_for('tickets_page') }}">Tickets</a></nav><div class="user-menu"><span>{{ session.get('user_name') }}</span><form method="post" action="{{ url_for('logout') }}"><button class="link-button">Sign out</button></form></div>{% endif %}</header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
