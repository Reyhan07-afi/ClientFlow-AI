{% extends 'base.html' %}{% block title %}Create account · ClientFlow{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">A clear place to run your client operations.</p><form method="post" class="stack"><label>Your name<input name="name" autocomplete="name" required maxlength="120"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">Create account</button></form><p class="muted centered">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
